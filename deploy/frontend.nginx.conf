worker_processes 1;
pid data/frontend-nginx.pid;
error_log stderr warn;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path data/nginx/client;
    proxy_temp_path data/nginx/proxy;
    fastcgi_temp_path data/nginx/fastcgi;
    uwsgi_temp_path data/nginx/uwsgi;
    scgi_temp_path data/nginx/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 127.0.0.1:8080;
        server_name xtbang.top;
        root dist/client;
        client_max_body_size 8m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' wss://xtbang.top; frame-src 'self' https://player.bilibili.com https://www.bilibili.com; worker-src 'self' blob:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        location ~ (^|/)\. { return 404; }
        location ~ ^/(api|note-shooter-api|uploads|cards|bestdori)(/|$) {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_read_timeout 90s;
        }
        location = /ws {
            proxy_pass http://127.0.0.1:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
        }
        location = / { try_files /index.html =404; }
        location ~ ^/(home|games|join|player|play|solo|host|settings|qr|login|community|community-admin|admin/users|shop|shop/[^/.]+|cart|checkout|stats|scores|diagnostics|note-shooter|queue|games/bang-klotski|bang-klotski|games/stopwatch-challenge|stopwatch-challenge|games/ba-mooncake)/?$ {
            try_files /index.html =404;
        }
        location /assets/ { expires 30d; try_files $uri =404; }
        location / { try_files $uri =404; }
    }
}
