<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音符射手 · 湘潭 BanG Dream! 同好会</title>
  <link rel="stylesheet" href="style.css?v=parity-20261031">
  <script defer src="engine.js?v=parity-20261031"></script>
</head>
<body>
<main id="game-container">
  <canvas id="game-canvas" aria-label="按住并移动鼠标或手指发射音符"></canvas>
  <div id="fps-display" aria-hidden="true" hidden></div>
  <button id="game-music-control" class="game-music-control" style="display:none" aria-label="切换游戏音乐">
    <span id="game-music-icon-play">♪</span><span id="game-music-icon-mute" style="display:none">♫</span>
  </button>
  <button id="pause-button" class="pause-button" style="display:none" aria-label="暂停游戏">Ⅱ</button>
  <div id="audio-container"></div>

  <section id="start-screen" class="game-overlay">
    <div class="poster">
      <img id="header-image" alt="BanG Dream! 角色插画">
      <div class="poster-copy"><span class="eyebrow">XT BANG! / ARCADE 01</span><h1 class="overlay-title" data-text="title">音符<br>射手。</h1><span class="poster-tag">LET THE MUSIC FLY ↗</span></div>
    </div>
    <div class="menu-content">
      <p class="overlay-text" data-text="instructions">移动鼠标或手指来控制角色<br>按住屏幕持续发射音符！</p>
      <label class="field-label" for="player-name-input">你的舞台昵称</label>
      <input id="player-name-input" class="nickname-input" type="text" maxlength="16" autocomplete="nickname" placeholder="输入昵称，留下你的成绩">
      <div class="difficulty-selector" aria-label="游戏难度">
        <button class="difficulty-btn" data-text="easy">简单</button><button class="difficulty-btn" data-text="normal">普通</button><button class="difficulty-btn" data-text="hard">困难</button><button class="difficulty-btn" data-text="endless">无尽模式</button>
      </div>
      <div class="stage-row"><label for="level-selector">选择关卡</label><select id="level-selector" class="level-selector"><option value="1" data-text="level1">第1关</option><option value="2" data-text="level2">第2关</option><option value="3" data-text="level3">第3关</option></select></div>
      <div class="button-row"><button id="start-button" class="start-button" data-text="startGame" disabled>开始游戏</button><button id="music-control" class="music-control" aria-label="切换音乐"><span id="music-icon-play">♪</span><span id="music-icon-mute" style="display:none">♫</span></button></div>
      <div id="loading-line"><div id="loading-fill"></div></div><div id="loading-text" role="status">正在准备舞台…</div>
      <button id="leaderboard-button" class="leaderboard-button" data-text="leaderboard" style="display:none">排行榜</button>
      <p id="connection-status" class="service-status" role="status">正在连接成绩服务…</p>
      <div id="language-selector" class="language-selector"><button class="lang-btn" data-lang="zh">中文</button><button class="lang-btn" data-lang="en">English</button><button class="lang-btn" data-lang="ja">日本語</button></div>
      <footer class="credits">原作 <a href="https://github.com/zfkdiyi/bangdream" target="_blank" rel="noreferrer">zfkdiyi / 音符射手 ↗</a></footer>
    </div>
  </section>

  <section id="pause-menu" class="game-overlay hidden" aria-label="暂停菜单"><div class="overlay-panel"><span class="eyebrow">TAKE A BREATH</span><h2 class="overlay-title" data-text="pauseTitle">游戏暂停</h2><p class="overlay-text">准备好，就继续你的演出。</p><button id="resume-button" class="start-button" data-text="resumeGame">继续游戏</button><button id="submit-score-button" class="end-button" data-text="submitScore">结束并结算</button><button id="pause-home-button" class="end-button" data-text="backToHome">返回选曲</button></div></section>

  <section id="result-screen" class="game-overlay hidden" aria-label="本次成绩"><div class="overlay-panel result-panel"><span class="eyebrow">YOUR LIVE RECORD</span><h2>本场谢幕。</h2><img id="result-image" alt="RESULT"><p id="result-message" class="overlay-text"></p><div class="result-text"><div id="result-diff"></div><div id="result-time"></div><div id="result-kill"></div><div id="result-combo"><span id="result-combo-text"></span><img id="result-fullcombo" class="result-fullcombo" alt="全连"></div><div id="result-total"><span id="result-total-text"></span><img id="result-rank" class="result-rank" alt="等级"></div></div><p id="score-status" class="service-status" role="status"></p><button id="restart-button" class="start-button" data-text="retry">重试</button><button id="home-button" class="end-button" data-text="backToHome">返回选曲</button></div></section>

  <section id="leaderboard" class="modal" role="dialog" aria-modal="true" aria-label="音符射手排行榜"><div class="leaderboard-content"><button class="close" id="leaderboard-close" aria-label="关闭排行榜">×</button><span class="eyebrow">HALL OF FAME</span><h2 data-text="leaderboard">排行榜</h2><p class="leaderboard-desc" data-text="leaderboard-desc">实时更新，时间15秒以下不收录</p><div class="leaderboard-filters"><select id="lb-level" aria-label="关卡"><option value="1" data-text="level1">第1关</option><option value="2" data-text="level2">第2关</option><option value="3" data-text="level3">第3关</option></select><select id="lb-difficulty" aria-label="难度"><option value="easy" data-text="easy">简单</option><option value="normal" data-text="normal">普通</option><option value="hard" data-text="hard">困难</option><option value="endless" data-text="endless">无尽模式</option></select><select id="lb-order" aria-label="排序"><option value="score" data-text="scoreOrder">积分顺序</option><option value="rank" data-text="rankOrder">级别顺序</option></select><select id="lb-show" aria-label="记录范围"><option value="top" data-text="show_top">前30名</option><option value="best" data-text="show_best">最好30次</option><option value="recent" data-text="show_recent">最近30次</option><option value="myRank" data-text="show_myRank">我的排名</option><option value="myBest" data-text="show_myBest">我的最好30次</option><option value="myRecent" data-text="show_myRecent">我的最近30次</option></select></div><div id="leaderboard-list" class="leaderboard-list" aria-live="polite"></div></div></section>
</main>
</body>
</html>
