<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>元祖BanG Dream!Chan 华容道小游戏</title>
    <meta name="description" content="元祖迷你动画小游戏复刻，体验增强" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #4a6741;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }

      #game-wrapper {
        position: relative;
        overflow: hidden;
      }

      #game-wrapper img.board-bg {
        display: block;
        width: 960px;
        height: 540px;
        pointer-events: none;
      }

      /* 棋盘网格区域 — 基于 board1.png 像素测量 */
      #board {
        position: absolute;
        top: 4.8%;
        left: 25.3%;
        width: 49.5%;
        height: 89.5%;
        overflow: hidden;
      }

      /* 内部棋盘容器：用于相对定位 */
      #board-inner {
        position: relative;
        width: 960px;
        height: 540px;
        margin: 0 auto;
      }

      /* 电梯楼层像素数字（改为文本显示，支持多位） */
      #elevator-floor {
        position: absolute;
        left: 4.4%;
        top: 23%;
        width: 14%;
        height: 18%;
        z-index: 5;
        pointer-events: none;
        background-color: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Courier New', monospace;
        /* 响应式字体，相对于父容器 */
        font-weight: bold;
        color: #f3ae4e;
        text-shadow: 2px 2px 0 #b3742e;
        line-height: 1;
        padding: 5px;
        box-sizing: border-box;
      }
      /* 桌面端字体固定大小 */
      @media (min-width: 781px) {
        #elevator-floor {
          font-size: 50px;
        }
      }

      .block {
        position: absolute;
        cursor: grab;
        transition:
          left 0.18s ease-out,
          top 0.18s ease-out;
        border-radius: 6px;
        overflow: hidden;
        z-index: 1;
      }

      .block.dragging {
        transition: none;
        cursor: grabbing;
        z-index: 50;
        filter: brightness(1.05);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      }

      .block:hover {
        z-index: 10;
        filter: brightness(1.08);
      }

      .block:active {
        cursor: grabbing;
      }

      .block img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        pointer-events: none;
      }

      /* 控制面板 — 右侧 */
      #control-panel {
        position: absolute;
        top: 50%;
        right: 2%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        z-index: 20;
      }

      #step-label {
        color: #c4a96a;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1px;
      }

      #step-display {
        color: #e8b74a;
        font-size: 52px;
        font-weight: 900;
        font-family: "Courier New", monospace;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        line-height: 1;
      }

      .btn {
        padding: 8px 4px;
        border: 2px solid #e8b74a;
        background: rgba(0, 0, 0, 0.6);
        color: #e8b74a;
        font-size: 14px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
        font-family: "Microsoft YaHei", sans-serif;
        width: 90px;
        text-align: center;
      }

      .btn:hover:not(#btn-voice):not(.floor-btn) {
        background: #e8b74a;
        color: #1a1a1a;
      }

      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn.toggle-on {
        background: #e8b74a;
        color: #1a1a1a;
      }

      /* 自定义楼层控件 */
      .floor-control {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 5px;
      }
      .floor-control input {
        width: 80px;
        padding: 6px 4px;
        background: rgba(0, 0, 0, 0.7);
        border: 2px solid #e8b74a;
        color: #e8b74a;
        font-weight: bold;
        border-radius: 20px;
        outline: none;
        font-size: 16px;
        text-align: center;
        font-family: 'Courier New', monospace;
      }
      .floor-control .btn {
        width: auto;
        padding: 6px 12px;
        font-size: 13px;
        background: rgba(0, 0, 0, 0.6);
        border-color: #e8b74a;
        color: #e8b74a;
      }
      .floor-control .btn:hover {
        background: #e8b74a;
        color: #1a1a1a;
      }

      /* 胜利结算界面 */
      #victory-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        z-index: 300;
        justify-content: center;
        align-items: center;
        animation: fadeIn 0.3s ease;
      }

      #victory-overlay.show {
        display: flex;
      }

      #victory-box {
        background: linear-gradient(135deg, #ff6b9d, #c44569);
        border: 4px solid #fff;
        border-radius: 20px;
        padding: 40px 50px;
        text-align: center;
        color: #fff;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        animation: popIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      }

      #victory-box h2 {
        font-size: 36px;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      #victory-box p {
        font-size: 20px;
        margin-bottom: 24px;
        opacity: 0.9;
      }

      #victory-box .btn {
        font-size: 16px;
        padding: 10px 28px;
        border-color: #fff;
        color: #fff;
        background: rgba(255, 255, 255, 0.15);
        width: auto;
      }

      #victory-box .btn:hover {
        background: #fff;
        color: #c44569;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes popIn {
        from { transform: scale(0.5); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      @media (max-width: 780px) {
        body {
          align-items: flex-start;
          min-height: auto;
          height: 100vh;
          overflow: hidden;
        }

        #game-wrapper {
          display: flex;
          flex-direction: column;
          align-items: center;
          width: 100vw;
          height: 100vh;
        }

        #board-inner {
          width: 100vw;
          height: 56.25vw;
          flex-shrink: 0;
        }

        #game-wrapper img.board-bg {
          width: 100%;
          height: 100%;
        }

        #control-panel {
          position: static;
          transform: none;
          flex-direction: row;
          flex-wrap: wrap;
          gap: 10px;
          z-index: 20;
          width: 100%;
          justify-content: center;
          margin-top: 8px;
          padding: 0 8px 10px;
        }

        #step-label {
          display: block;
          font-size: 14px;
          margin-right: -8px;
        }
        #step-display {
          font-size: 24px;
          margin-right: 8px;
        }
        .btn {
          font-size: 12px;
          padding: 6px 10px;
          width: auto;
          min-width: 50px;
        }
        .floor-control {
          width: 100%;
          justify-content: center;
          order: 1;
        }
        .floor-control input {
          width: 100px;
          font-size: 14px;
        }

      }

      /* 更新日志弹窗样式 */
      #changelog-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.75);
        z-index: 400;
        justify-content: center;
        align-items: center;
        animation: fadeIn 0.3s ease;
      }

      #changelog-overlay.show {
        display: flex;
      }

      #changelog-box {
        background: linear-gradient(135deg, #7b5e7b, #4a3f5a);
        border: 4px solid #e8b74a;
        border-radius: 20px;
        padding: 30px 40px;
        text-align: center;
        color: #fff;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        animation: popIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        max-width: 500px;
      }

      #changelog-box h2 {
        font-size: 28px;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        color: #e8b74a;
      }

      #changelog-content {
        text-align: left;
        margin: 20px 0;
        font-size: 16px;
        line-height: 1.6;
        max-height: 300px;
        overflow-y: auto;
        padding-right: 10px;
      }

      #changelog-content ul {
        padding-left: 20px;
      }

      #changelog-content li {
        margin-bottom: 5px;
      }

      .changelog-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
      }

      .changelog-buttons .btn {
        width: auto;
        padding: 8px 16px;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.5);
        border-color: #e8b74a;
        color: #e8b74a;
      }

      .changelog-buttons .btn:hover {
        background: #e8b74a;
        color: #1a1a1a;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <div id="board-inner">
        <img class="board-bg" src="images/board1.png" alt="棋盘背景" />
        <div id="elevator-floor">1</div> <!-- 默认显示1楼 -->


        <div id="board"></div>
      </div>

      <div id="control-panel">
        <div id="step-label">步 数</div>
        <div id="step-display">0</div>
        <button class="btn" id="btn-reset" onclick="resetGame()">重 置</button>
        <button class="btn" id="btn-hint" onclick="getHint()">提 示</button>
        <button class="btn toggle-on" id="btn-voice" onclick="toggleVoice()">
          🎶角色音效
        </button>

        <!-- 自定义楼层控件 -->
        <div class="floor-control">
          <input type="number" id="custom-floor" value="1" min="1" step="1">
          <button class="btn floor-btn" id="random-floor">随机</button>
        </div>
      </div>
    </div>

    <div id="victory-overlay">
      <div id="victory-box">
        <h2>🎉 通关成功！</h2>
        <p>米歇尔成功逃出！用了 <span id="victory-steps">0</span> 步</p>
        <button class="btn" onclick="resetGame()">再来一局</button>
      </div>
    </div>

    <!-- 更新日志弹窗 -->
    <div id="changelog-overlay">
      <div id="changelog-box">
        <h2>📢 更新日志 v1.1</h2>
        <div id="changelog-content">
          <ul>
            <li>新增：追加更多角色音效以及部分成员的随机播放（多惠，摩卡等角色多语音）</li>
            <li>新增：重置按钮音效</li>
            <li>优化：移动端布局适配横竖屏</li>
            <li>修复：部分音效无法预加载的问题</li>
            <li>新增：更新日志弹窗（就是本窗口）</li>
          </ul>
        </div>
        <div class="changelog-buttons">
          <button class="btn" id="changelog-ok">我~知~道~啦~</button>
          <button class="btn" id="changelog-skip">了解 本次更新不再弹出</button>
          <button class="btn" id="changelog-ignore">永久忽略</button>
        </div>
      </div>
    </div>

    <script>
      // ============================================================
      // 更新日志配置
      // ============================================================
      const CHANGELOG_VERSION = 'v1.1'; // 当前版本号，更新时修改
      const STORAGE_PREFIX = "bangdream:bang-klotski:";
      const changelogOverlay = document.getElementById('changelog-overlay');

      function storageGet(key) {
        return localStorage.getItem(STORAGE_PREFIX + key);
      }

      function storageSet(key, value) {
        localStorage.setItem(STORAGE_PREFIX + key, value);
      }

      // 检查是否需要显示更新日志
      function shouldShowChangelog() {
        // 永久忽略检查
        if (storageGet('changelog_permanent_ignore') === 'true') {
          return false;
        }
        // 本次更新不再弹出检查
        const lastVersion = storageGet('changelog_last_version');
        if (lastVersion === CHANGELOG_VERSION) {
          return false;
        }
        return true;
      }

      // 隐藏弹窗
      function hideChangelog() {
        changelogOverlay.classList.remove('show');
      }

      // 显示弹窗
      function showChangelog() {
        changelogOverlay.classList.add('show');
      }

      // 按钮事件
      document.getElementById('changelog-ok').addEventListener('click', () => {
        hideChangelog();
        // 不做任何记录，下次加载仍会显示
      });

      document.getElementById('changelog-skip').addEventListener('click', () => {
        hideChangelog();
        storageSet('changelog_last_version', CHANGELOG_VERSION);
      });

      document.getElementById('changelog-ignore').addEventListener('click', () => {
        hideChangelog();
        storageSet('changelog_permanent_ignore', 'true');
      });

      // ============================================================
      // 数据模型
      // ============================================================
      const COLS = 4;
      const ROWS = 5;
      const GAP = 2;

      const TYPES = {
        "2x2": [2, 2],
        "1x2": [1, 2],
        "2x1": [2, 1],
        "1x1": [1, 1],
      };

      // 初始布局 — 参照效果图
      const INITIAL_LAYOUT = [
        { id: "michelle", type: "2x2", x: 1, y: 0, img: "images/michelle.png" },
        { id: "nyamu", type: "1x2", x: 0, y: 0, img: "images/nyamu.png" },
        { id: "moca", type: "1x2", x: 3, y: 0, img: "images/moca.png" },
        { id: "arisa", type: "1x2", x: 0, y: 2, img: "images/arisa.png" },
        { id: "yukina", type: "2x1", x: 1, y: 2, img: "images/yukina.png" },
        { id: "eve", type: "1x2", x: 3, y: 2, img: "images/eve.png" },
        { id: "saya", type: "1x1", x: 1, y: 3, img: "images/saya.png" },
        { id: "box", type: "1x1", x: 2, y: 3, img: "images/box.png" },
        { id: "otae", type: "1x1", x: 0, y: 4, img: "images/otae.png" },
        { id: "tsukushi", type: "1x1", x: 3, y: 4, img: "images/tsukushi.png" },
      ];

      // 当前游戏状态
      let blocks = [];
      let steps = 0;
      let solving = false;

      // 提示系统状态
      let hintSolution = null;
      let hintIndex = 0;
      let hintStateKey = null;
      let hintWorker = null;
      let hintComputing = false;

      // 拖拽状态
      let dragState = null;

      // DOM 引用
      const boardEl = document.getElementById("board");
      const stepDisplay = document.getElementById("step-display");
      const victoryOverlay = document.getElementById("victory-overlay");
      const victorySteps = document.getElementById("victory-steps");
      const elevatorFloor = document.getElementById("elevator-floor");
      const customFloorInput = document.getElementById("custom-floor");
      const randomFloorBtn = document.getElementById("random-floor");

      // ============================================================
      // 自定义楼层功能
      // ============================================================
      function updateElevatorFloor(value) {
        // 确保为正整数
        let num = parseInt(value, 10);
        if (isNaN(num) || num < 1) num = 1;
        elevatorFloor.textContent = num;
        customFloorInput.value = num; // 同步输入框
      }

      // 监听输入框变化
      customFloorInput.addEventListener('input', (e) => {
        updateElevatorFloor(e.target.value);
      });

      // 随机按钮
      randomFloorBtn.addEventListener('click', () => {
        // 生成1~1000随机整数（可调整上限）
        const randomNum = Math.floor(Math.random() * 1000) + 1;
        updateElevatorFloor(randomNum);
      });

      // ============================================================
      // 渲染
      // ============================================================
      function deepCloneLayout(layout) {
        return layout.map((b) => ({ ...b }));
      }

      function getCellSize() {
        const boardRect = boardEl.getBoundingClientRect();
        return {
          cellW: boardRect.width / COLS,
          cellH: boardRect.height / ROWS,
        };
      }

      function renderBoard() {
        boardEl.innerHTML = "";
        const { cellW, cellH } = getCellSize();

        blocks.forEach((block) => {
          const [w, h] = TYPES[block.type];
          const el = document.createElement("div");
          el.className = "block";
          el.id = "block-" + block.id;
          el.style.width = cellW * w - GAP * 2 + "px";
          el.style.height = cellH * h - GAP * 2 + "px";
          el.style.left = block.x * cellW + GAP + "px";
          el.style.top = block.y * cellH + GAP + "px";

          const img = document.createElement("img");
          img.src = block.img;
          img.alt = block.id;
          img.draggable = false;
          el.appendChild(img);

          // 鼠标拖拽
          el.addEventListener("mousedown", (e) => {
            e.preventDefault();
            startDrag(block.id, e.clientX, e.clientY);
          });

          // 触摸拖拽
          el.addEventListener("touchstart", (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            startDrag(block.id, touch.clientX, touch.clientY);
          });

          boardEl.appendChild(el);
        });
      }

      function updateBlockPosition(block) {
        const { cellW, cellH } = getCellSize();
        const el = document.getElementById("block-" + block.id);
        if (!el) return;
        el.style.left = block.x * cellW + GAP + "px";
        el.style.top = block.y * cellH + GAP + "px";
      }

      // ============================================================
      // 拖拽交互
      // ============================================================
      function startDrag(blockId, startX, startY) {
        if (solving) return;
        const block = blocks.find((b) => b.id === blockId);
        if (!block) return;

        const el = document.getElementById("block-" + blockId);
        el.classList.add("dragging");

        dragState = {
          blockId,
          startX,
          startY,
          origGridX: block.x,
          origGridY: block.y,
          moved: false,
        };
      }

      function onDragMove(clientX, clientY) {
        if (!dragState) return;

        const { cellW, cellH } = getCellSize();
        const dx = clientX - dragState.startX;
        const dy = clientY - dragState.startY;

        const threshold = Math.min(cellW, cellH) * 0.1;

        if (dragState.moved) return;

        let moveDx = 0;
        let moveDy = 0;

        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > threshold) moveDx = 1;
          else if (dx < -threshold) moveDx = -1;
        } else {
          if (dy > threshold) moveDy = 1;
          else if (dy < -threshold) moveDy = -1;
        }

        if (moveDx !== 0 || moveDy !== 0) {
          const success = moveBlock(dragState.blockId, moveDx, moveDy);
          if (success) dragState.moved = true;
        }
      }

      function endDrag() {
        if (!dragState) return;
        const el = document.getElementById("block-" + dragState.blockId);
        if (el) el.classList.remove("dragging");
        dragState = null;
      }

      document.addEventListener("mousemove", (e) => onDragMove(e.clientX, e.clientY));
      document.addEventListener("mouseup", endDrag);
      document.addEventListener("touchmove", (e) => {
        if (dragState) {
          e.preventDefault();
          const touch = e.touches[0];
          onDragMove(touch.clientX, touch.clientY);
        }
      }, { passive: false });
      document.addEventListener("touchend", endDrag);
      document.addEventListener("touchcancel", endDrag);

      // ============================================================
      // 音效系统 (使用音频文件)
      // ============================================================
      const audioCache = {};

      // 角色语音配置：每个成员可配置多个音效文件，移动时随机选取一个
      const CHARACTER_AUDIO_MAP = {
        eve: ["images/eve.mp3"], // 示例：多个语音文件，请根据实际修改
        otae: ["images/otae1.mp3","images/otae2.mp3"], 
        moca: ["images/moca1.mp3",'images/moca2.mp3'],
        nyamu: ["images/nyamu.mp3"],
        saya: ["images/saya.mp3"],
        yukina: ["images/ykn.mp3"],
        arisa: ["images/aras.mp3"],
        tsukushi: ["images/tsukushi.mp3"]// 只有一个文件，则总是播放它
        // 可继续添加其他角色
      };

      // UI 音效（重置按钮等）
      const UI_AUDIO_MAP = {
        reset: "images/reset.mp3", // 重置按钮音效
      };

      let audioReady = false;

      function unlockAudioForMobile() {
        if (audioReady) return;
        audioReady = true;
        const warmup = new Audio();
        warmup.volume = 0;
        warmup.play().catch(() => {});
      }

      function tryPlayAudio(src) {
        if (!src) return;
        if (!audioReady) return;
        if (audioCache[src]) {
          const a = audioCache[src].cloneNode();
          a.volume = audioCache[src].volume || 0.6;
          a.play().catch(() => {});
          return;
        }

        const audio = new Audio(src);
        audio.volume = 0.6;

        const p = audio.play();
        if (p !== undefined) {
          p.then(() => {
            audioCache[src] = audio;
          }).catch((e) => {
            console.warn("Audio play failed or file not found:", src);
          });
        }
      }

      let voiceEnabled = true;

      function toggleVoice() {
        voiceEnabled = !voiceEnabled;
        const btn = document.getElementById("btn-voice");
        if (btn) {
          btn.classList.toggle("toggle-on", voiceEnabled);
        }
      }

      function playCharacterAudio(charId) {
        if (!voiceEnabled) return;
        const variants = CHARACTER_AUDIO_MAP[charId];
        if (!variants || variants.length === 0) return;
        const randomIndex = Math.floor(Math.random() * variants.length);
        tryPlayAudio(variants[randomIndex]);
      }

      const typeSoundMap = {
        "2x2": "images/2x2.mp3",
        "1x2": "images/1x2.mp3",
        "2x1": "images/1x2.mp3",
        "1x1": "images/1x1.mp3",
      };

      function playMoveSound(block) {
        const typeSound = typeSoundMap[block.type];
        if (typeSound) tryPlayAudio(typeSound);
        if (block.id !== "box") {
          playCharacterAudio(block.id);
        }
      }

      function playWinSound() {
        tryPlayAudio("images/win.mp3");
      }

      function playResetSound() {
        if (!voiceEnabled) return; // 重置音效也受语音开关控制
        tryPlayAudio(UI_AUDIO_MAP.reset);
      }

      function preloadSounds() {
        const audioList = [
          "images/win.mp3",
          ...Object.values(typeSoundMap),
          ...Object.values(CHARACTER_AUDIO_MAP).flat(),
          UI_AUDIO_MAP.reset,
        ];
        const uniqueSrcs = [...new Set(audioList)];
        uniqueSrcs.forEach((src) => {
          if (src && !audioCache[src]) {
            const audio = new Audio();
            audio.src = src;
            audio.volume = 0.6;
            audio.load();
            audioCache[src] = audio;
          }
        });
      }

      // ============================================================
      // 碰撞检测与移动
      // ============================================================

      function buildGrid(blocksState) {
        const grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
        blocksState.forEach((b) => {
          const [w, h] = TYPES[b.type];
          for (let dy = 0; dy < h; dy++) {
            for (let dx = 0; dx < w; dx++) {
              grid[b.y + dy][b.x + dx] = b.id;
            }
          }
        });
        return grid;
      }

      function canMove(block, dx, dy, grid) {
        const [w, h] = TYPES[block.type];
        const nx = block.x + dx;
        const ny = block.y + dy;

        if (nx < 0 || ny < 0 || nx + w > COLS || ny + h > ROWS) return false;

        for (let r = 0; r < h; r++) {
          for (let c = 0; c < w; c++) {
            const occupant = grid[ny + r][nx + c];
            if (occupant !== null && occupant !== block.id) return false;
          }
        }
        return true;
      }

      function moveBlock(blockId, dx, dy) {
        const block = blocks.find((b) => b.id === blockId);
        if (!block) return false;

        const grid = buildGrid(blocks);
        if (!canMove(block, dx, dy, grid)) return false;

        block.x += dx;
        block.y += dy;
        updateBlockPosition(block);
        playMoveSound(block);

        if (!solving) {
          hintSolution = null;
          hintIndex = 0;
          hintStateKey = null;
          steps++;
          stepDisplay.textContent = steps;
        }

        if (block.id === "michelle" && block.x === 1 && block.y === 3) {
          setTimeout(() => {
            playWinSound();
            showVictory();
          }, 300);
        }

        return true;
      }

      function showVictory() {
        victorySteps.textContent = steps;
        victoryOverlay.classList.add("show");
      }

      function resetGame() {
        playResetSound(); // 播放重置音效

        solving = false;
        steps = 0;
        stepDisplay.textContent = "0";
        victoryOverlay.classList.remove("show");
        blocks = deepCloneLayout(INITIAL_LAYOUT);
        hintSolution = null;
        hintIndex = 0;
        hintStateKey = null;
        hintComputing = false;
        if (hintWorker) {
          hintWorker.terminate();
          hintWorker = null;
        }
        const btnHint = document.getElementById("btn-hint");
        if (btnHint) {
          btnHint.disabled = false;
          btnHint.textContent = "提 示";
        }
        renderBoard();
        // 重置电梯显示为1
        updateElevatorFloor(1);
      }

      // ============================================================
      // 提示系统 (Web Worker BFS)
      // ============================================================


      function getHint() {
        if (solving || hintComputing) return;

        const btnHint = document.getElementById("btn-hint");

        if (hintSolution && hintIndex < hintSolution.length) {
          const move = hintSolution[hintIndex];
          solving = true;
          moveBlock(move.id, move.dx, move.dy);
          steps++;
          stepDisplay.textContent = steps;
          solving = false;
          hintIndex++;
          if (hintIndex >= hintSolution.length) {
            hintSolution = null;
            hintStateKey = null;
          }
          return;
        }

        hintComputing = true;
        btnHint.disabled = true;
        btnHint.textContent = "思考中…";

        hintWorker = new Worker("/games/bang-klotski/solver-worker.js");

        hintWorker.onmessage = function (e) {
          hintWorker = null;
          hintComputing = false;
          btnHint.disabled = false;
          btnHint.textContent = "提 示";

          if (e.data.success && e.data.moves.length > 0) {
            hintSolution = e.data.moves;
            hintIndex = 0;
            const move = hintSolution[hintIndex];
            solving = true;
            moveBlock(move.id, move.dx, move.dy);
            steps++;
            stepDisplay.textContent = steps;
            solving = false;
            hintIndex++;
            if (hintIndex >= hintSolution.length) {
              hintSolution = null;
              hintStateKey = null;
            }
          }
        };

        hintWorker.onerror = function () {
          hintWorker = null;
          hintComputing = false;
          btnHint.disabled = false;
          btnHint.textContent = "提 示";
          alert("求解出错，请重试");
        };

        hintWorker.postMessage(deepCloneLayout(blocks));
      }

      // ============================================================
      // 启动
      // ============================================================
      window.addEventListener("load", () => {
        preloadSounds();
        resetGame();
        ["pointerdown", "touchstart", "keydown"].forEach((eventName) => {
          document.addEventListener(eventName, unlockAudioForMobile, { once: true });
        });

        // 显示更新日志弹窗（如果需要）
        if (shouldShowChangelog()) {
          showChangelog();
        }
      });

      window.addEventListener("resize", () => {
        renderBoard();
      });
    </script>
  </body>
</html>
